name: Build installers

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check source token
        run: |
          if [ -z "${{ secrets.SOURCE_TOKEN }}" ]; then
            echo "缺少 Actions Secret：SOURCE_TOKEN"
            echo "请在本仓库 Settings → Secrets → Actions 中添加，令牌只需能读取私有仓库 ShareQiu1994/nexinmap-downloader。"
            exit 1
          fi

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ShareQiu1994/nexinmap-downloader
          ref: main
          token: ${{ secrets.SOURCE_TOKEN }}
          path: app

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: |
          set -e
          for i in 1 2 3; do
            echo "::group::npm install attempt $i"
            npm install --no-audit --no-fund --prefer-offline && [ -d node_modules ] && [ -x node_modules/.bin/vite ] && { echo "::endgroup::"; exit 0; }
            echo "::endgroup::"
            echo "npm install attempt $i failed, retrying..."
            rm -rf node_modules
            sleep 5
          done
          echo "npm install failed after 3 attempts"
          exit 1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall -y --locked tauri-cli@^2

      - name: Build
        working-directory: app
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Verify macOS app signature
        if: matrix.platform == 'macos-latest'
        run: |
          DMG=$(find "app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -type f -name "*.dmg" | head -1)
          test -n "$DMG"
          MOUNT_DIR=$(mktemp -d)
          trap 'hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true; rm -rf "$MOUNT_DIR"' EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          APP=$(find "$MOUNT_DIR" -maxdepth 1 -type d -name "*.app" -print -quit)
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '"version"' app/src-tauri/tauri.conf.json | head -1 | sed 's/.*: *"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Collect Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exeFile = Get-ChildItem -Path "app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $newName = "nexinmap-downloader_${{ steps.version.outputs.VERSION }}_windows_x64-setup.exe"
          Copy-Item $exeFile.FullName -Destination $newName

      - name: Collect macOS artifacts
        if: matrix.platform == 'macos-latest'
        run: |
          ARCH=$([[ "${{ matrix.target }}" == *aarch64* ]] && echo "arm64" || echo "x64")
          DMG=$(find "app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name "*.dmg" | head -1)
          NEW_NAME="nexinmap-downloader_${{ steps.version.outputs.VERSION }}_macos_${ARCH}.dmg"
          cp "$DMG" "$NEW_NAME"

      - name: Collect Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          DEB=$(find "app/src-tauri/target/${{ matrix.target }}/release/bundle/deb" -name "*.deb" | head -1)
          APPIMAGE=$(find "app/src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -name "*.AppImage" | head -1)
          cp "$DEB" "nexinmap-downloader_${{ steps.version.outputs.VERSION }}_linux_amd64.deb"
          cp "$APPIMAGE" "nexinmap-downloader_${{ steps.version.outputs.VERSION }}_linux_amd64.AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: nexinmap-downloader_*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check source token
        run: |
          if [ -z "${{ secrets.SOURCE_TOKEN }}" ]; then
            echo "缺少 Actions Secret：SOURCE_TOKEN"
            exit 1
          fi

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ShareQiu1994/nexinmap-downloader
          ref: main
          token: ${{ secrets.SOURCE_TOKEN }}
          path: app

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '"version"' app/src-tauri/tauri.conf.json | head -1 | sed 's/.*: *"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: nexinmap-downloader v${{ steps.version.outputs.VERSION }}
          prerelease: ${{ steps.version.outputs.PRERELEASE == 'true' }}
          files: artifacts/*
          body: |
            本次升级不会删除已有任务、历史记录、输出文件、下载范围书签、设置或瓦片缓存。
            Windows、Linux、macOS Intel 和 Apple Silicon 安装包由 GitHub Actions 构建。
            macOS 安装包尚未进行 Apple Developer ID 签名与公证，部分系统仍可能显示安全提示。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
